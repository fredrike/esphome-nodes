esphome:
  name: display-node
  platform: ESP32
  board: esp32dev
  on_boot:
      - output.turn_off: onboard_led

wifi:
  use_address: display_node.local
  networks:
  - ssid: "Erlandssons IOT"
    password: !secret wifi_iot_password
    hidden: true
    priority: 256
  - ssid: "Fredrik_AP"
    password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Display_node Fallback Hotspot"
    password: "N9sWXNGtarny"

captive_portal:

# Enable logging
logger:
  level: debug

# Enable Home Assistant API
api:
  encryption:
    key: "ruEVs+YesuLameOanehpAmy1zYrNI2VTahhP2wnpwQ4=" 

ota:
  - platform: esphome
    password: !secret ota_password

spi:
  clk_pin: 13
  mosi_pin: 14

