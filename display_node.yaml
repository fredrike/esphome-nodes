display:
  - platform: waveshare_epaper
    id: epaper
    cs_pin: 15
    busy_pin: 25
    reset_pin: 26
    dc_pin: 27
    model: 4.20in
    rotation: 180°
    # full_update_every: 30
    update_interval: 3600s
    lambda: |-
      int x, y, c;
      ESP_LOGI("display", "Updating..");

      /* Print time in HH:MM format */
      it.strftime(125, -10, id(clock_font), TextAlign::TOP_CENTER, "%H:%M", id(current_time).now());

      it.line(259, -10, 259, 200);it.line(261, 0, 261, 200);it.line(260, 0, 260, 200);
      it.line(0, 200, 259, 200);it.line(0, 201, 261, 201);it.line(0, 202, 260, 202);
      it.line(0, 201, 500, 201); //it.line(0, 201, 261, 201);it.line(0, 202, 260, 202);

      /* Moon icon */
      if(id(moon_icon).has_state()) {
        y = 155, x = 230;
        ESP_LOGI("Moon", "%s", id(moon_icon).state.c_str());
        it.printf(x, y, id(moon_font), TextAlign::BASELINE_CENTER, "%s", id(moon_icon).state.c_str());
      }
      /* WiFi Signal Strenght */
      if(id(wifisignal).has_state()) {
        x = 398, y = 298;
        if (id(wifisignal).state >= -50) {
            //Excellent
            it.print(x, y, id(wifi_font), TextAlign::BOTTOM_RIGHT, "󰤨");
            ESP_LOGI("WiFi", "Exellent, 󰤨");
        } else if (id(wifisignal).state  >= -60) {
            //Good
            it.print(x, y, id(wifi_font), TextAlign::BOTTOM_RIGHT, "󰤥");
            ESP_LOGI("WiFi", "Good, 󰤥");
        } else if (id(wifisignal).state  >= -67) {
            //Fair
            it.print(x, y, id(wifi_font), TextAlign::BOTTOM_RIGHT, "󰤢");
            ESP_LOGI("WiFi", "Fair, 󰤢");
        } else if (id(wifisignal).state  >= -70) {
            //Weak
            it.print(x, y, id(wifi_font), TextAlign::BOTTOM_RIGHT, "󰤟");
            ESP_LOGI("WiFi", "Weak, 󰤟");
        } else {
            //Unlikely working signal
            it.print(x, y, id(wifi_font), TextAlign::BOTTOM_RIGHT, "󰤫");
            ESP_LOGI("WiFi", "Unlikely, 󰤫");
        }
      }

      // Current weather
      if(id(weather_forecast_today).has_state()) {
        std::string str = id(weather_forecast_today).state;
        ESP_LOGI("Weather", "%s", str.c_str());
        std::size_t current, previous = 0;
        char delim = ';';
        current = str.find(delim);
        int y = 140, x = 5;
        for (int i=0; i<3; i++) {
            if(i == 0) {
              it.printf(x, y-2, id(weather_font),
                TextAlign::BASELINE_LEFT,
                "%s", str.substr(previous, current - previous).c_str());
            } else if (i == 1) {
              ESP_LOGD("weather","%dx%d %s", (i % 1 ? 270 : 320), x,
                str.substr(previous, current - previous).c_str());
              /* it.printf(y, x, id(status_font),
                TextAlign::TOP_LEFT,
                "%s", str.substr(previous, current - previous).c_str());
              */
            } else if (i == 2) { // Chance for rain
              it.printf(x, y + 2, id(icon_font_new), TextAlign::TOP_LEFT, "󰕊"); // Umbrella
              it.printf(x + 30, y + 10, id(status_font),
                TextAlign::TOP_LEFT,
                "%s%%", str.substr(previous, current - previous).c_str());
            }
            // y += 100;
            previous = current + 1;
            current = str.find(delim, previous);
        }
      }

      // Print inside temperature (from homeassistant sensor)
      y = 138, x = 110;
      if (id(inside_temperature_).has_state()) {
        it.print(x, y-6, id(icon_font_new), TextAlign::BOTTOM_RIGHT, "󰽔");
        it.printf(x+2, y, id(temp_font), TextAlign::BOTTOM_LEFT , "%5.1f°", id(inside_temperature_).state);
      }
      y += 40;
      // Print outside temperature (from homeassistant sensor)
      if (id(outside_temperature).has_state()) {
        it.print(x, y-6, id(icon_font_new), TextAlign::BOTTOM_RIGHT, "󰽕"); 
        it.printf(x+2, y, id(temp_font), TextAlign::BOTTOM_LEFT, "%5.1f°", id(outside_temperature).state);
      }
      y = 245, x = 40;
      // Print ekorrbo temp
      if (id(ekorrbo_temperature).has_state()) {
        //ESP_LOGI("Ekorrbo", %s", id(ekorrbo_temperature).state.c_str());
        it.printf(x+1, y, id(temp_font), TextAlign::BOTTOM_LEFT, "%5.1f°", id(ekorrbo_temperature).state);
        it.print(x, y-6, id(icon_font_new), TextAlign::BOTTOM_RIGHT, "󰮧");
      }
      /*
      x = 165;
      if (id(tallholmen_temperature).has_state()) {
        // Print tallholmen temp
        it.printf(x+1, y, id(temp_font), TextAlign::BOTTOM_LEFT, "%5.1f°", id(tallholmen_temperature).state);
        it.print(x, y-6, id(icon_font_new), TextAlign::BOTTOM_RIGHT, "󰓣");
      }
      x += 165 - 40;
      x = 40;
      if (id(emma_temperature).has_state()) {
        // Print pool temp
        //it.printf(x+1, y, id(temp_font), TextAlign::BOTTOM_LEFT, "%5.1f°", id(emma_temperature).state);
        //it.print(x, y-6, id(icon_font_new), TextAlign::BOTTOM_RIGHT, "󱩟");
      }
      */
      
      // Print chia
      if(id(chia_balance).has_state() && id(flexpool_balance).has_state()) {
        it.print(1, 265, id(icon_font_small), TextAlign::BOTTOM_LEFT, "󰌪");
        if (id(flexpool_update).has_state()) {
          //it.printf(23, 270, id(chia_font), TextAlign::BOTTOM_LEFT, "%.2f xch, (%s)", id(chia_balance).state + id(flexpool_balance).state, id(flexpool_update).state.c_str());
          //ESP_LOGI("󰌪", "%s", id(flexpool_update).state.c_str());
          int seconds = round(id(current_time).now().timestamp - atoi(id(flexpool_last_seen_raw).state.c_str()));
          if (seconds > (24 * 3600))
            it.printf(23, 270, id(chia_font), TextAlign::BOTTOM_LEFT, "%.2f xch (offline)", id(chia_balance).state + id(flexpool_balance).state);
          else {
          int days = seconds / (24 * 3600);
          seconds = seconds % (24 * 3600);
          int hours = seconds / 3600;
          seconds = seconds % 3600;
          int minutes = seconds /  60;
          seconds = seconds % 60;
          ESP_LOGI("󰌪", "%.2f xch (%s ago)", id(chia_balance).state + id(flexpool_balance).state, (
            (days ? to_string(days) + "d " : "") +
            (hours ? to_string(hours) + "h " : "") +
            (minutes ? to_string(minutes) + "m" : "")
            //+ (to_string(seconds) + "s")
          ).c_str());
          it.printf(23, 265, id(chia_font), TextAlign::BOTTOM_LEFT, "%.2f", id(chia_balance).state + id(flexpool_balance).state); /*, 
            (
              (days ? to_string(days) + "d " : "") +
              (hours ? to_string(hours) + "h " : "") +
              (minutes ? to_string(minutes) + "m" : "")
              //+ (to_string(seconds) + "s")
            ).c_str()
          );*/
          }
        } else {
          it.printf(23, 265, id(chia_font), TextAlign::BOTTOM_LEFT, "%.2f !", id(chia_balance).state + id(flexpool_balance).state);
        }
      }


      // std::string str = "mon:cloud:12.1:30%:tue:rain:10.2:40%:wed:sunny:18.0:0%:thu:snow:-12.2:10%";
      if(id(weather_forecast).has_state()) {
        std::string str = id(weather_forecast).state;
        ESP_LOGI("Weather", "%s", str.c_str());
        std::size_t current, previous = 0;
        char delim = ';';
        current = str.find(delim);
        int x = 340, y = 2;
        for (int i=0; i<4; i++) {
          //ESP_LOGI("t", "%d", i);
          for (int j=0; j<4; j++) {
            if(j == 1) {  // Weather icon.
              it.printf(x - 65, y + 25, id(weather_font),
                TextAlign::BASELINE_LEFT,
                "%s", str.substr(previous, current - previous).c_str());
            } else {
              ESP_LOGD("Weather","%s", str.substr(previous, current - previous).c_str());
              it.printf((j == 0 ? x - 10 : 390), y,
                id(status_font),
                (j == 0 ? TextAlign::TOP_LEFT : TextAlign::TOP_RIGHT),
                "%s", str.substr(previous, current - previous).c_str());
              y += 16;
            }
            previous = current + 1;
            current = str.find(delim, previous);
          }
          //y += 2;
        }
      }

      // Print consumer
      if (id(top_consumer).has_state()) {
        it.printf(1, 295, id(status_font), TextAlign::BOTTOM_LEFT , "Total: %.0f W, %s W", id(sparsnas).state, id(top_consumer).state.c_str());
          ESP_LOGI("󰉁", "Total: %.0f W, %s W", id(sparsnas).state, id(top_consumer).state.c_str());
      }
      // it.line(0, 299, 400, 299);
      
      //it.graph(239, 201, id(nordpool_graph));
      // Print consumer
      if (id(nordpool_se4).has_state()) {
        it.printf(239, 252, id(chia_font), TextAlign::TOP_LEFT , "SE4: %.02f kr/kWh", id(nordpool_se4).state);
          ESP_LOGI("󰉁", "SE4: %.02f", id(nordpool_se4).state);
      }
  
      // Nordpool graph
      if( !(id(current_time).now().is_valid() && id(se4_today).has_state() && id(se4_tomorrow).has_state()))
        return;
      int currentHour = id(current_time).now().hour;//13;
      //currentHour = 2;
      float values[49];
      std::string today = id(se4_today).state;
      static std::string tomorrow = id(se4_tomorrow).state;
      static std::string yesterday;
      ESP_LOGD("SE4", "%s | %s | %s", yesterday.c_str(), today.c_str(), tomorrow.c_str());
      std::string str = today.substr(1, today.length()-2);
      if (tomorrow.length() > 2) {
        str += ", ";
        yesterday = str;
        str += tomorrow.substr(1, tomorrow.length()-2);
      } else if(yesterday.length() > 2) {
        str = yesterday;
        str += today.substr(1, today.length()-2);
        // 4.098, 3.926, 3.928, 3.715, 3.66, 3.671, 3.831, 3.814, 3.996, 4.364, 4.452, 4.706, 4.741, 4.427, 4.476, 4.588, 4.93, 5.644, 5.863, 5.627, 5.235, 4.572, 4.415, 4.175,  | [3.82, 3.305, 3.272, 3.272, 3.272, 3.775, 5.219, 6.885, 7.255, 6.839, 6.891, 6.781, 6.68, 6.582, 6.899, 7.286, 7.432, 7.825, 7.434, 6.76, 6.46, 5.441, 4.618, 2.727] | []
        //str = "4.098, 3.926, 3.928, 3.715, 3.66, 3.671, 3.831, 3.814, 3.996, 4.364, 4.452, 4.706, 4.741, 4.427, 4.476, 4.588, 4.93, 5.644, 5.863, 5.627, 5.235, 4.572, 4.415, 4.175, 3.82, 3.305, 3.272, 3.272, 3.272, 3.775, 5.219, 6.885, 7.255, 6.839, 6.891, 6.781, 6.68, 6.582, 6.899, 7.286, 7.432, 7.825, 7.434, 6.76, 6.46, 5.441, 4.618, 2.727";
        currentHour += 24;
      }
      ESP_LOGD("SE4", "%s", str.c_str());
      char delim = ',';
      int current = str.find(delim);
      int previous = 0;
      float max=-999, min=999;
      int maxRead = 0;
      for(int i=0; i<48; i++) {
        values[i] = atof(str.substr(previous, current - previous).c_str());
        if (current < 0) {maxRead=i; break;}
        previous = current + 2;
        current = str.find(delim, previous);
        if  (values[i] > max)
          max = values[i];
        if (values[i] < min)
          min = values[i];
      }
      //Normalize based on min/max
      ESP_LOGD("SE4", "%d %f %f %f", currentHour, min, max, (max-min)*0.2);
      int length = 48;
      x = 110+48;
      y = 202 + length; //+50;
      it.printf(x-2, y+6, id(tiny_font), TextAlign::BOTTOM_RIGHT, "%d", (int)floor(min));
      it.printf(x-2, y-length-3, id(tiny_font), TextAlign::TOP_RIGHT, "%d", (int)ceil(max));
      it.line(x, y, 400, y);
      for (int i=0; i<48; i++) {
        int height = round(length*(values[i]-floor(min))/(ceil(max)-floor(min)));
        ESP_LOGD("SE4", "%02d %s %.2f %d %d %d", i%24, (i==currentHour)? "+" : " ", values[i], height, y, y+height);
        if (i <= maxRead) {
          if (i == currentHour)
            it.filled_rectangle(x, y - height, 6, height);
          else
            it.rectangle(x, y - height, 6, height);
        }
        if (i == 23) // Draw a line at midnight
          it.line(x+6, y-length, x+6, y+6);
        if (!((i+1)%12)) //Draw a line at noon
          it.line(x+6, y, x+6, y+4);
        if (!((i+1)%6)) //Draw a line every 6th hour
          it.line(x+6, y, x+6, y+2);
        x += 5;
      }

      

