substitutions:
  node_name: ekorrbo
  friendly_name: Ekorrbo Powermeter

esphome:
  name: ${node_name}_esp
  friendly_name: ${friendly_name}
  on_boot:
    priority: 800.0
    then: 
      - output.turn_off: gnd
      - delay: 20ms
      - component.update: ekorrbo_uptime_raw

esp8266:
  board: d1_mini

wifi:
  networks:
  - ssid: "Erlandssons IOT"
    password: !secret wifi_iot_password
    hidden: true
    priority: 127
  - ssid: "Fredrik_AP"
    password: !secret wifi_password
    priority: 1
  - ssid: "Ekorrbo"
    password: !secret wifi_ekorrbo
    priority: 2
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name} Hotspot"
    password: !secret wifi_ap

captive_portal:

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

output:
  - platform: gpio
    pin:
      number: D6
      mode: OUTPUT
    id: gnd 

binary_sensor:
  - platform: gpio
    pin:
      number: D2
      allow_other_uses: true
    name: pulse
    internal: true
    on_press: 
      then:
        - light.turn_on:
            id: led
        - delay: 250ms
        - light.turn_off:
            id: led
time:
  - platform: homeassistant
    timezone: "Europe/Stockholm"

light:
  - platform: status_led
    pin:
      number: D4
      inverted: True
    name: "${friendly_name} Status LED"
    id: led
    internal: true

sensor:
  - platform: dht
    model: AM2302
    pin: D7
    update_interval: 20s
    temperature:
      name: "${friendly_name} Temperature"
      filters:
      - calibrate_linear:
          # Map 0.0 (from sensor) to 0.0 (true value)
          - 0.0 -> 0.0
          # - 26.4 -> 22.8
          - 28.0 -> 18.5
          - 18.6 -> 17.7
          - 17.6 -> 16.2
      - median:
          window_size: 5
          send_every: 3
          send_first_at: 3
      - filter_out: 0.0
      #internal: true
    humidity:
      name: "${friendly_name} Humidity"
      filters:
      - median:
          window_size: 5
          send_every: 3
          send_first_at: 3
      - filter_out: 0.0
      #internal: true
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal Sensor"
    update_interval: 180s
  - platform: uptime
    name: "${friendly_name} Uptime Sensor"
    id: ${node_name}_uptime_raw
    update_interval: 6000s
    state_class: total_increasing
    device_class: "duration"
    on_raw_value:
      then:
        - logger.log:
            format: "Raw Value of Uptime sensor: %f, %f"
            args: ['id(${node_name}_uptime_raw).raw_state', 'id(${node_name}_uptime_raw).state']
            level: INFO
        - text_sensor.template.publish:
            id: ekorrbo_uptime
            state: !lambda |-
              int seconds = round(id(${node_name}_uptime_raw).raw_state);
              int days = seconds / (24 * 3600);
              seconds = seconds % (24 * 3600);
              int hours = seconds / 3600;
              seconds = seconds % 3600;
              int minutes = seconds /  60;
              seconds = seconds % 60;
              return (
                (days ? String(days) + "d " : "") +
                (hours ? String(hours) + "h " : "") +
                (minutes ? String(minutes) + "m " : "") //+
                //(String(seconds) + "s") 
              ).c_str();
  - platform: pulse_counter
    pin:
      number: D2
      allow_other_uses: true
    name: '${friendly_name} Power Meter'
    update_interval: 10s
    id: ${node_name}_power
    unit_of_measurement: 'W'
    state_class: measurement
    device_class: power
    accuracy_decimals: 0
    filters:
      - multiply: 300 # 200 pulse/kWh (60/200*1000)
      - sliding_window_moving_average:
          window_size: 3
          send_every: 2
    total:
      id: ${node_name}_energy_meter
      unit_of_measurement: 'kWh'
      name: '${friendly_name} Energy Meter'
      state_class: total_increasing
      device_class: energy
      accuracy_decimals: 3
      filters:
        - throttle: 30s
        - heartbeat: 30s
        - multiply: 0.005 # 1/200 (1kWh / 200 pulses per kWh)

  - platform: total_daily_energy
    power_id: ${node_name}_energy_meter
    name: '${friendly_name} Total Daily Energy'
    unit_of_measurement: 'kWh'
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 3

text_sensor:
  - platform: template
    name: ${friendly_name} Uptime
    id: ${node_name}_uptime
    icon: mdi:clock-start
    internal: True
